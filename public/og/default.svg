<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img">
  <title>Krtse XO — websites and the systems behind them</title>
  <rect width="1200" height="630" fill="#faf9f6" />

  <text x="80" y="120" font-family="ui-monospace, 'Geist Mono Variable', SFMono-Regular, monospace"
        font-size="28" letter-spacing="5" fill="#14161a">KRTSE XO</text>

  <text x="80" y="230" font-family="Georgia, 'Newsreader Variable', ui-serif, serif"
        font-size="64" fill="#14161a">I build websites, and</text>
  <text x="80" y="304" font-family="Georgia, 'Newsreader Variable', ui-serif, serif"
        font-size="64" fill="#14161a">the systems behind them.</text>

  <text x="80" y="380" font-family="ui-monospace, 'Geist Mono Variable', SFMono-Regular, monospace"
        font-size="20" letter-spacing="1" fill="#5c6672">A one-person studio in Skopje</text>

  <!-- One signal-blue wave line along the bottom, matching the water field's
       sine-summed look at a single instant. -->
  <path d="M0 560 C 90 542, 180 578, 270 560 S 450 542, 540 560
           S 720 578, 810 560 S 990 542, 1080 560 S 1200 560, 1200 560"
        fill="none" stroke="#1f5eff" stroke-width="3" opacity="0.7" />
</svg>
